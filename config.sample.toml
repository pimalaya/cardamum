[accounts.example]
default = true				# the account commands run on without -a
#card.list.page-size = 25		# cards per page, absent -s, 0 listing every card
#card.composer = "tcard edit"		# the command -i edits a card through, on its path
#card.composer = ["tcard", "edit"]	# the same, as a program and its arguments
#addressbook.default = "Contacts"	# the addressbook the card commands take without -k

#proxy.url = "socks5h://localhost:1080"	# a socks5, socks5h or http proxy for every network backend, all_proxy and https_proxy otherwise [http://localhost:3128]
#proxy.username = "alice"		# its username
#proxy.password.command = "exit 127"	# prints its password

#tls.provider = "rustls"			# the build's first otherwise, for every network backend [native-tls]
#tls.rustls.crypto = "ring"			# the build's first otherwise [aws]
#tls.cert = "/path/to/cert.pem"			# a PEM certificate to trust
#tls.client.cert = "/path/to/client.pem"	# a PEM client certificate, for mutual TLS
#tls.client.key = "/path/to/client.key.pem"	# its PEM private key, PKCS#8 under native-tls

# CardDAV
#carddav.server = "https://dav.example.org/dav"	# the DAV context root discovery starts from, its /.well-known/carddav tried when it names no path [dav.example.org]
#carddav.auth.basic.username = "alice@example.org"	# HTTP Basic; no auth at all, or auth = "none", for a server asking for none
#carddav.auth.basic.password.command = "exit 127"	# prints the password
#carddav.auth.basic.password.raw = "secret"	# the password itself

#carddav.auth.bearer.token.command = "exit 127"	# prints a bearer token instead, an OAuth 2.0 one for Google
#carddav.home = "https://dav.example.org/dav/alice/"	# the addressbook home set in place of server, nothing discovered; Google's is https://www.googleapis.com/carddav/v1/principals/<address>/lists

# Network, the same keys under jmap, msgraph and gpeople
#carddav.alpn = ["http/1.1"]			# the ALPN ids rustls offers, empty for none
#carddav.tls.cert = "/path/to/cert.pem"		# the tls keys, for CardDAV alone, field by field
#carddav.proxy.url = "socks5h://localhost:1080"	# the proxy keys, for CardDAV alone

# JMAP
#jmap.server = "https://jmap.example.org/jmap/session"	# the session URL, fetched as is, a bare host going through its /.well-known/jmap [jmap.example.org]

#jmap.auth.basic.username = "alice@example.org"	# HTTP Basic
#jmap.auth.basic.password.command = "exit 127"	# prints the password
#jmap.auth.basic.password.raw = "secret"	# the password itself

#jmap.auth.bearer.token.command = "exit 127"	# prints a bearer token, an OAuth 2.0 or a Fastmail API one; auth.header.command a whole Authorization value

# Microsoft Graph
#msgraph.user-id = "me"				# the signed-in user's contacts, another's by user id or principal name [bob@example.org]
#msgraph.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token
#msgraph.auth.token.raw = "secret"		# the token itself, short-lived

# Google People
#gpeople.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token
#gpeople.auth.token.raw = "secret"		# the token itself, short-lived

# vdir
#vdir.root = "~/Contacts"	# a directory per addressbook, a .vcf file per card

# pimdir
#pimdir.root = "/path/to/store"	# the pimdir store a sync engine fills, which must exist
#pimdir.account = "example"	# the account to read, for a store holding several
