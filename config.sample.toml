[accounts.example]
default = true				# the account commands run on without -a

card.list.page-size = 25		# cards per page, absent -s, 0 listing every card
#card.composer = "tcard edit"		# the command -i edits a card through, on its path
#card.composer = ["tcard", "edit"]	# the same, as a program and its arguments
#addressbook.default = "Contacts"	# the addressbook the card commands take without -k

#proxy.url = "socks5h://localhost:1080"	# a SOCKS5 proxy for every network backend
#proxy.url = "http://localhost:3128"	# an HTTP one, all_proxy and https_proxy otherwise

#proxy = { url = "socks5h://localhost:1080", username = "alice", password.command = "exit 127" }	# with credentials

# CardDAV
#
#carddav.server = "https://dav.example.org/dav"		# the DAV context root, where the principal walk starts
##carddav.server = "dav.example.org"			# its /.well-known/carddav, over https
##carddav.home = "https://dav.example.org/dav/alice/"	# the addressbook home set, skipping every discovery step
#carddav.auth.basic.username = "alice@example.org"	# HTTP Basic; or bearer.token, or auth = "none"
#carddav.auth.basic.password.command = "exit 127"	# prints the password
##carddav.auth.basic.password.raw = "secret"		# the password itself
#carddav.alpn = ["http/1.1"]				# the ALPN id rustls offers
##carddav.alpn = []					# none
##carddav.tls.provider = "rustls"			# rustls, the build's first TLS otherwise
##carddav.tls.provider = "native-tls"			# the platform's TLS
##carddav.tls.rustls.crypto = "ring"			# rustls on ring, the build's first otherwise
##carddav.tls.rustls.crypto = "aws"			# rustls on aws-lc-rs
##carddav.tls.cert = "/path/to/cert.pem"		# a PEM certificate to trust
##carddav.proxy.url = "socks5h://localhost:1080"	# the proxy keys, for CardDAV alone

# CardDAV without credentials
#
#carddav.server = "http://localhost:5232"	# a local server such as Radicale
#carddav.auth = "none"				# no Authorization header, as no auth key at all

# Google CardDAV
#
#carddav.home = "https://www.googleapis.com/carddav/v1/principals/alice@gmail.com/lists"	# the address book home of the account, addressed by hand
