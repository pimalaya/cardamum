[package]
name = "cardamum"
description = "CLI to manage contacts"
version = "0.3.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["cli", "contact", "carddav", "jmap", "vdir"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/cardamum"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-ring", "carddav", "jmap", "msgraph", "gpeople", "vdir", "pimdir", "vendored"]
native-tls = ["pimalaya-stream/native-tls", "io-pim-discovery?/native-tls", "io-webdav?/native-tls", "io-jmap?/native-tls", "io-msgraph?/native-tls", "io-gpeople?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-pim-discovery?/rustls-aws", "io-webdav?/rustls-aws", "io-jmap?/rustls-aws", "io-msgraph?/rustls-aws", "io-gpeople?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-pim-discovery?/rustls-ring", "io-webdav?/rustls-ring", "io-jmap?/rustls-ring", "io-msgraph?/rustls-ring", "io-gpeople?/rustls-ring"]
carddav = ["dep:io-webdav", "dep:io-pim-discovery"]
jmap = ["dep:io-jmap", "vcard-rs/jscontact", "dep:base64-codec"]
msgraph = ["dep:io-msgraph", "io-msgraph/vcard"]
gpeople = ["dep:io-gpeople", "io-gpeople/vcard"]
vdir = ["dep:io-vdir"]
pimdir = ["dep:io-pimdir", "dep:ariadne", "io-pimdir/search"]
vendored = ["pimalaya-stream/vendored", "io-webdav?/vendored", "io-jmap?/vendored", "io-msgraph?/vendored", "io-gpeople?/vendored", "io-pimdir?/vendored"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.4", default-features = false, features = ["build"] }

[dev-dependencies]
io-oauth = { version = "0.7", default-features = false, features = ["client", "jwt-bearer", "rustls-ring"] }
pimalaya-config = { version = "0.4", default-features = false, features = ["sample"] }
tempfile = { version = "3", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
ariadne = { version = "0.6", default-features = false, optional = true }
base64-codec = { version = "0.1", default-features = false, features = ["alloc"], optional = true }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
getrandom = { version = "0.4", default-features = false }
idna_adapter = { version = "=1.0.0", default-features = false }
io-http = { version = "0.8", default-features = false }
io-jmap = { version = "0.9", default-features = false, features = ["client"], optional = true }
io-msgraph = { version = "0.9", default-features = false, features = ["client"], optional = true }
io-gpeople = { version = "0.7", default-features = false, features = ["client"], optional = true }
io-pim-discovery = { version = "0.12", default-features = false, features = ["pacc", "rfc6764", "stream"], optional = true }
io-pimdir = { version = "0.12", default-features = false, features = ["client"], optional = true }
io-vdir = { version = "0.3", default-features = false, features = ["client", "serde"], optional = true }
io-webdav = { version = "0.8", default-features = false, features = ["client"], optional = true }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.4", default-features = false, features = ["mcp", "prompt", "repl", "terminal"] }
pimalaya-config = { version = "0.4", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.4", default-features = false, features = ["std"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false, features = ["serde"] }
vcard-rs = { version = "0.6", default-features = false, features = ["parser"] }

[patch.crates-io]
io-gpeople = { git = "https://github.com/pimalaya/io-gpeople", rev = "e4a9cac80d023688118dbae88f8535145e8d2c9b" }
io-pim-discovery = { git = "https://github.com/pimalaya/io-pim-discovery", rev = "d1f999ce582eb359b701caea4168edfdd76fa193" }
io-webdav = { git = "https://github.com/pimalaya/io-webdav", rev = "777d34eea1b48f7d90635e3e82e1a96a9d57504e" }
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "3bada992cde034a6aa9474c169b6e2f892776db1" }
