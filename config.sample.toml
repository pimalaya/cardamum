# ================================================================================
# `cardamum` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/cardamum/config.toml
#   - $HOME/.config/cardamum/config.toml
#   - $HOME/.cardamumrc
#
# Override with `cardamum -c <PATH>` or `CARDAMUM_CONFIG=<PATH>`. Multiple paths
# can be passed at once, separated by `:`; the first one is the base and the
# rest are deep-merged on top of it.
#
# `cardamum configure` discovers the contacts services your provider publishes,
# asks how to authenticate, tests the connection and writes the account here.
#
# Everything it does not cover is written by hand, which is what this file
# documents: keep the backend you need and delete the rest. Ready-made blocks
# for named providers live in the README.
# ================================================================================

# --------------------------------------------------------------------------------
# Global config
# --------------------------------------------------------------------------------

# Borders of every table, `UTF8_FULL_CONDENSED` by default. Presets are listed
# at https://docs.rs/comfy-table/latest/comfy_table/presets/index.html
#table.preset = "││──╞═╪╡┆    ┬┴┌┐└┘"

# How columns are sized, `dynamic` by default. See
# https://docs.rs/comfy-table/latest/comfy_table/enum.ContentArrangement.html
#table.arrangement = "dynamic"
#table.arrangement = "dynamic-full-width"
#table.arrangement = "disabled"

# Command a card is edited through, spawned on the path of a temporary vCard
# file it edits in place, with every stream inherited. `card create -i` and
# `card update -i` both go through it, and `--composer <COMMAND>` overrides it
# for one invocation.
#
# The path is appended as the last argument, so a shell line takes it there
# too. The command must block until the edit is done: use `code --wait`, not
# `code`.
#
# tCard (https://github.com/pimalaya/tcard) projects the card as a TOML form,
# opens $VISUAL or $EDITOR on it and folds the edits back onto the card's own
# bytes. It reads no configuration file of its own, so set $VISUAL or $EDITOR
# in your shell. Its --version flag does not apply here: cardamum hands it a
# card that already declares one, picked by `card create --vcard-version`.
#card.composer = "tcard edit"
#card.composer = ["tcard", "edit"]
#
# Any editor works, the card then being raw vCard rather than a form.
#card.composer = "nvim"

# Default page size for `card list`. The `-s/--page-size` flag wins when
# passed, then this value, then the hard fallback of 25.
#card.list.page-size = 50

# Addressbook the `card` commands act on when their `-k/--addressbook` flag
# is omitted.
#addressbook.default = "Contacts"

# --------------------------------------------------------------------------------
# Table rendering: addressbooks list
#
# One color per column of `addressbook list`, `reset` taking the terminal's own.
# --------------------------------------------------------------------------------

#addressbook.list.table.id-color = "red"
#addressbook.list.table.name-color = "green"
#addressbook.list.table.description-color = "reset"
#addressbook.list.table.color-color = "reset"

# --------------------------------------------------------------------------------
# Table rendering: cards list
#
# One color per column of `card list`.
# --------------------------------------------------------------------------------

#card.list.table.id-color = "red"
#card.list.table.fn-color = "green"
#card.list.table.email-color = "blue"
#card.list.table.tel-color = "dark-yellow"

# --------------------------------------------------------------------------------
# Table rendering: account list
#
# One color per column of `account list`, which has no per-account override.
# --------------------------------------------------------------------------------

#account.list.table.name-color = "green"
#account.list.table.backends-color = "blue"
#account.list.table.default-color = "reset"

# --------------------------------------------------------------------------------
# Accounts
#
# One block per account, each declaring one backend. Secrets accept either a
# `command` (a shell command line, or a program plus its arguments) or a `raw`
# plaintext value. An OAuth 2.0 token is issued and refreshed by an external
# tool such as `ortie`, which the command reads it from.
# --------------------------------------------------------------------------------

# --------------------------------------------------------------------------------
# Vdir backend
#
# Local addressbook collections stored on disk; see
# <https://vdirsyncer.pimutils.org/en/stable/vdir.html>. Each immediate
# subdirectory of `home-dir` is one addressbook.
# --------------------------------------------------------------------------------

[accounts.vdir-example]
# When `--account` is missing, use this account as the default one.
default = true
vdir.home-dir = "~/.local/share/vdirsyncer/contacts"

# --------------------------------------------------------------------------------
# pimdir backend
#
# A local pimdir store, the offline cache a sync engine such as Neverest fills.
# It is a cache, not a server: a card whose body has not been fetched yet still
# lists but cannot be read until a sync hydrates it, and every write is staged
# for the next sync to push.
# --------------------------------------------------------------------------------

#[accounts.pimdir-example]
# The store directory, holding `pimdir.db` and `objects/`. It must already exist:
# creating a store is the sync engine's job.
#pimdir.root = "~/.local/share/pimdir"
# The account the collections are grouped under, for a store shared by several
# accounts or domains. Unset reads every collection in the store.
#pimdir.account = "personal"

# --------------------------------------------------------------------------------
# CardDAV backend
#
# The addressbook home set is resolved from the first field set, each skipping
# more work than the next: `home` is the pre-resolved home set URL, `server` the
# context root the principal walk starts from, and `discover` a bare domain
# resolved at runtime through PACC, `.well-known` then RFC 6764 SRV.
#
# Discovery costs DNS and HTTP round-trips on every run. `server` accepts a full
# URL, a bare domain or `domain:port`, a bare authority defaulting to `https`.
# --------------------------------------------------------------------------------

[accounts.carddav-example]
carddav.discover = "example.org"
carddav.server = "https://carddav.example.org/dav/addressbooks"
#carddav.home = "https://carddav.example.org/dav/addressbooks/user/me/default"

# Basic authentication (RFC 7617).
carddav.auth.basic.username = "username"
carddav.auth.basic.password.command = "pass show example"
#carddav.auth.basic.password.command = ["pass", "show", "example"]
#carddav.auth.basic.password.raw = "password"

# Bearer authentication (RFC 6750), mainly for OAuth 2.0.
#carddav.auth.bearer.token.command = "ortie token show"
#carddav.auth.bearer.token.raw = "oauth2-token"

# No credentials, for a server that asks for none.
#carddav.auth = "none"

# TLS configuration. A `cert` path expands `~` and any environment variable.
#carddav.tls.provider = "rustls"
#carddav.tls.rustls.crypto = "ring"
#carddav.tls.cert = "~/.local/share/ca/example.pem"

# --------------------------------------------------------------------------------
# JMAP backend (RFC 8620 + RFC 9610)
#
# `server` accepts a bare authority (discovered via `GET /.well-known/jmap`) or
# a full session URL. Authentication is one of `header` (raw Authorization
# value), `bearer` (token) or `basic` (username + password).
# --------------------------------------------------------------------------------

[accounts.jmap-example]
jmap.server = "fastmail.com"
#jmap.server = "https://api.fastmail.com/jmap/session"

jmap.auth.bearer.token.command = "ortie token show"
#jmap.auth.header.raw = "Bearer oauth2-token"
#jmap.auth.basic.username = "username"
#jmap.auth.basic.password.command = "pass show example"

# TLS configuration.
#jmap.tls.provider = "rustls"
#jmap.tls.rustls.crypto = "ring"

# ALPN identifiers offered during the TLS handshake, `[]` to skip the
# negotiation. Rustls only; native-tls ignores them.
#jmap.alpn = ["http/1.1"]

# --------------------------------------------------------------------------------
# Microsoft Graph backend
#
# The Graph API is OAuth 2.0 bearer-token only. `user-id` defaults to `me` (the
# authenticated user).
# --------------------------------------------------------------------------------

[accounts.msgraph-example]
#msgraph.user-id = "me"
msgraph.auth.token.command = "ortie token show"
#msgraph.auth.token.raw = "oauth2-token"

# TLS configuration, and the ALPN identifiers offered during the handshake,
# `[]` skipping the negotiation. Rustls only; native-tls ignores them.
#msgraph.tls.provider = "rustls"
#msgraph.alpn = ["http/1.1"]

# --------------------------------------------------------------------------------
# Google People backend
#
# The People API is OAuth 2.0 bearer-token only.
# --------------------------------------------------------------------------------

[accounts.people-example]
people.auth.token.command = "ortie token show"
#people.auth.token.raw = "oauth2-token"

# TLS configuration, and the ALPN identifiers offered during the handshake,
# `[]` skipping the negotiation. Rustls only; native-tls ignores them.
#people.tls.provider = "rustls"
#people.alpn = ["http/1.1"]
