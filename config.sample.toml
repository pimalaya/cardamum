# ================================================================================
# `cardamum` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/cardamum/config.toml
#   - $HOME/.config/cardamum/config.toml
#   - $HOME/.cardamumrc
#
# Override with `cardamum -c <PATH>` or `CARDAMUM_CONFIG=<PATH>`. Multiple paths
# can be passed at once, separated by `:`; the first one is the base and the
# rest are deep-merged on top of it.
#
# Run bare `cardamum` (no subcommand) to launch the wizard. It opens with a
# single prompt that takes an email address, a server URL, or a local folder
# path. The recommended path is automatic discovery: enter your email address
# and the wizard searches every reachable contacts service (CardDAV, JMAP, plus
# the Google People and Microsoft Graph APIs for those providers) and lets you
# pick one, then asks how to authenticate against it. A `scheme://` URL
# discovers from its host, its scheme narrowing the results (`carddav(s)` to
# CardDAV, `jmap(s)` to JMAP). A filesystem path is a local vdir or pimdir
# store, told apart by their on-disk markers.
#
# The wizard only configures what it can discover automatically: it never
# prompts for a hand-entered server field, and stops with a pointer to this
# file when discovery finds nothing. It tests the account, then offers to save
# the configuration for you; when stdout is redirected it prints it instead, so
# `cardamum > config.toml` still works, exactly like Ortie.
# ================================================================================

# --------------------------------------------------------------------------------
# Global config
# --------------------------------------------------------------------------------

